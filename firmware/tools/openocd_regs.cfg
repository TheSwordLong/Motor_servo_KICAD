# Register dump for GD32F303VET6 (Cortex-M4F).
#
# Sourced by tools\flash_openocd.ps1 (-Registers) and by tools\openocd_regs.ps1.
# The target must already be halted before this runs; the caller decides when to
# resume, so this file must not call halt/resume/exit itself.
#
# Usage in an OpenOCD session:
#   init; halt
#   source [find tools/openocd_regs.cfg]
#   resume; exit
#
# Addresses (GD32F30x user manual / CMSIS):
#   GPIO : GPIO_BASE 0x40010800, +0x400 per port (A..E)
#   USART: USART_BASE 0x40004400, USART0 is the APB2 instance at 0x4000F400
#   RCU  : 0x40021000
#   TIMER: TIMER_BASE 0x40000000, TIMER3 = +0x800
#   AFIO : 0x40010000

echo ""
echo "==================== GD32F303VET6 register dump ===================="

echo "--- core / clock ---"
echo "CPUID      0xE000ED00 :"
mdw 0xE000ED00
echo "SysTick CTL/LOAD/VAL 0xE000E010..18 :"
mdw 0xE000E010 3
echo "CFSR 0xE000ED28 (0 = no configurable fault) / HFSR 0xE000ED2C :"
mdw 0xE000ED28
mdw 0xE000ED2C
echo "RCU_CTL 0x40021000 (bit17 HXTALSTB, bit25 PLLSTB) / RCU_CFG0 0x40021004 (SCSS bits2:3=10 -> PLL) :"
mdw 0x40021000
mdw 0x40021004
echo "RCU_APB1EN 0x4002101C (bit17 USART1EN, bit2 TIMER3EN) / RCU_APB2EN 0x40021018 (bit0 AFEN, bit14 USART0EN) :"
mdw 0x4002101C
mdw 0x40021018

echo "--- GPIO: OCTL is the driven level, ISTAT is the pin level ---"
echo "GPIOA CTL0 0x40010800 / CTL1 0x40010804 / ISTAT 0x40010808 / OCTL 0x4001080C :"
mdw 0x40010800 4
echo "GPIOB CTL0 0x40010C00 / CTL1 / ISTAT / OCTL :"
mdw 0x40010C00 4
echo "GPIOC CTL0 0x40011000 / OCTL 0x4001100C :"
mdw 0x40011000
mdw 0x4001100C
echo "GPIOD CTL0 0x40011400 / CTL1 / ISTAT / OCTL :"
mdw 0x40011400 4
echo "GPIOE CTL0 0x40011800 / CTL1 0x40011804 :"
mdw 0x40011800 2
echo "AFIO_PCF0 0x40010004 (remap configuration) :"
mdw 0x40010004

echo "--- USART1 = RS-485 on PA2/PA3, DE on PA1 ---"
echo "STAT0 0x40004400 (bit5 RBNE, bit6 TC, bit7 TBE, bits0-3 errors) :"
mdw 0x40004400
echo "DATA 0x40004404 / BAUD 0x40004408 / CTL0 0x4000440C (bit2 REN, bit3 TEN, bit13 UEN) / CTL2 0x40004414 :"
mdw 0x40004404
mdw 0x40004408
mdw 0x4000440C
mdw 0x40004414

echo "--- USART0 = debug port on PA9/PA10 ---"
echo "STAT0 0x4000F400 / CTL0 0x4000F40C :"
mdw 0x4000F400
mdw 0x4000F40C

echo "--- TIMER3 = PWM on PD12..PD15 ---"
echo "CTL0 0x40000400 (bit0 CEN) / CNT 0x40000424 / CAR 0x4000042C / CH0CV 0x40000434 :"
mdw 0x40000400
mdw 0x40000424
mdw 0x4000042C
mdw 0x40000434

echo ""
echo "Notes:"
echo "  * RS-485 idle check: GPIOA OCTL bit1 (DE) must be 0 and bit2 (TX) must be 1."
echo "  * Enable bits confirm the peripherals the firmware switched on; a 0 where"
echo "    one is expected means the init code did not run."
echo "  * mdw prints 32-bit words; bit numbering above is LSB = 0."
echo "===================================================================="
echo ""
